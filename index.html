<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2E7D32">
<title>حجز الوجبات — تحميل</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root {
    --bg: #F4F7F4; --card: #FFFFFF; --text: #16221A; --muted: #5C6B60;
    --primary: #2E7D32; --on-primary: #FFFFFF; --border: rgba(0,0,0,.10);
    --soft: #E7F1E7; --shadow: 0 8px 28px rgba(20,60,30,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F0F0F; --card: #181818; --text: #D6D6D6; --muted: #9A9A9A;
      --primary: #D4D4D4; --on-primary: #111111; --border: rgba(255,255,255,.14);
      --soft: #232323; --shadow: 0 8px 28px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Naskh Arabic", sans-serif;
    line-height: 1.7; min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  .langs { display: flex; justify-content: flex-start; gap: 4px; font-size: 13px; margin-bottom: 8px; }
  .langs button {
    font: inherit; color: var(--muted); background: none; border: 0; padding: 4px 8px;
    border-radius: 999px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { color: var(--text); background: var(--soft); font-weight: 700; }
  header { text-align: center; padding: 14px 0 6px; }
  .logo { width: 104px; height: 104px; border-radius: 24px; box-shadow: var(--shadow); display: block; margin: 0 auto 14px; }
  h1 { font-size: 27px; line-height: 1.3; margin: 0 0 6px; font-weight: 800; }
  .tagline { margin: 0 auto; color: var(--muted); font-size: 15px; max-width: 320px; }
  .meta {
    display: inline-block; margin-top: 14px; padding: 4px 14px; border-radius: 999px;
    background: var(--soft); font-size: 13px; color: var(--muted); direction: ltr; unicode-bidi: isolate;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 22px;
    padding: 18px; margin-top: 18px; box-shadow: var(--shadow);
  }
  .btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-height: 62px; border-radius: 18px; text-decoration: none; font-size: 19px; font-weight: 800;
    background: var(--primary); color: var(--on-primary); padding: 10px 16px; text-align: center;
  }
  .btn small { font-size: 12.5px; font-weight: 500; opacity: .9; }
  .btn:active { transform: scale(.985); }
  .alt { display: block; text-align: center; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
  .alt a { color: var(--text); font-weight: 700; text-underline-offset: 3px; }
  h2 { font-size: 15.5px; margin: 0 0 10px; font-weight: 800; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  ol li { counter-increment: s; position: relative; padding-inline-start: 38px; margin-bottom: 12px; font-size: 14.5px; }
  ol li::before {
    content: counter(s); position: absolute; inset-inline-start: 0; top: 1px; width: 26px; height: 26px;
    border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 800; font-size: 13px;
  }
  ol li:last-child { margin-bottom: 0; }
  .notes { font-size: 14px; color: var(--text); margin: 0; white-space: pre-line; }
  .tip { font-size: 13px; color: var(--muted); margin: 10px 4px 0; }
  .notice { display: none; background: var(--soft); border-radius: 14px; padding: 10px 14px; font-size: 13.5px; margin-top: 16px; text-align: center; }
  footer { margin-top: 22px; text-align: center; font-size: 12.5px; color: var(--muted); }
  footer p { margin: 0 0 6px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="langs" aria-label="language">
    <button data-l="ar">العربية</button><button data-l="fr">Français</button><button data-l="en">English</button>
  </nav>

  <header>
    <img class="logo" src="logo.png" width="104" height="104" alt="">
    <h1 id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <span class="meta" id="meta"></span>
  </header>

  <div class="notice" id="notice"></div>

  <main>
    <section class="card">
      <a class="btn" id="dl" href="#"><span id="dlText"></span><small id="dlSub"></small></a>
      <span class="alt" id="alt"></span>
    </section>

    <section class="card">
      <h2 id="stepsT"></h2>
      <ol><li id="s1"></li><li id="s2"></li><li id="s3"></li></ol>
    </section>

    <section class="card" id="newCard">
      <h2 id="newT"></h2>
      <p class="notes" id="notes"></p>
    </section>

    <p class="tip" id="tgTip"></p>
    <p class="tip" id="updTip"></p>
  </main>

  <footer><p id="foot"></p></footer>
</div>

<script>
// يملؤه tool/publish_landing.sh عند كل إصدار (version.json + تاريخ النشر). لا تعدّله يدوياً.
window.RELEASE = {"build": 4, "versionName": "1.2.1", "minBuild": 4, "notes": {"ar": "تحسين الأداء (نوافذ أسرع وأسلس)، مظهر تلقائي ليلاً ونهاراً، شريط تنقل أوضح، حفظ ذكي في تفاصيل الحساب، وتحديث نص الموافقة (الإحصاءات التقنية المجهولة جزء من الشروط).", "fr": "Meilleures performances (fenêtres plus fluides), thème automatique jour/nuit, barre de navigation plus claire, enregistrement intelligent dans les détails du compte, et texte de consentement mis à jour (statistiques techniques anonymes incluses).", "en": "Better performance (smoother popups), automatic day/night theme, a clearer navigation bar, smart saving in account details, and updated consent text (anonymous technical statistics are part of the terms)."}, "apks": {"arm64-v8a": {"url": "https://github.com/dayahimour/meal-auto-releases/releases/download/v1.2.1/meal_auto-1.2.1-arm64-v8a.apk", "sha256": "b33c79cb1795290d8b83f5d0326823e77701e4f93f551e8978572088f356b07f", "size": 19979300}, "armeabi-v7a": {"url": "https://github.com/dayahimour/meal-auto-releases/releases/download/v1.2.1/meal_auto-1.2.1-armeabi-v7a.apk", "sha256": "8a4a35170cb91939099a753c3ddf460e69eac03eebb95aa0652e2b20844d6f27", "size": 17519088}}, "released": "2026-10-26"};
</script>
<script>
(function () {
  var R = window.RELEASE;
  var T = {
    ar: {
      name: "حجز الوجبات", tagline: "يحجز وجباتك الجامعية تلقائياً كل ليلة",
      meta: "v{v} · {mb} MB · {d}", dl: "تحميل التطبيق",
      sub64: "نسخة 64 بت — لمعظم الهواتف", sub32: "نسخة 32 بت — للهواتف الأقدم",
      alt64: "هاتف قديم أو لم يُثبَّت؟ حمّل <a href=\"{u}\">نسخة 32 بت</a>",
      alt32: "هاتفك حديث؟ حمّل <a href=\"{u}\">نسخة 64 بت</a> (أسرع)",
      stepsT: "كيف أثبّته؟",
      s1: "حمّل الملف. إن ظهر تحذير من المتصفح فاختر «الاحتفاظ» أو «تنزيل على أي حال».",
      s2: "افتح الملف المحمّل، واسمح بالتثبيت من هذا المصدر حين يطلب هاتفك، ثم اضغط «تثبيت».",
      s3: "افتح «حجز الوجبات»، اقرأ الشروط ووافق، ثم أضف حسابك.",
      newT: "ما الجديد",
      tgTip: "من تيليغرام؟ إن لم يبدأ التنزيل فافتح الرابط في Chrome.",
      updTip: "بعد التثبيت يتحدّث التطبيق من تلقاء نفسه عند صدور إصدار جديد.",
      notAndroid: "هذا التطبيق لهواتف أندرويد فقط. افتح هذه الصفحة من هاتفك.",
      foot: "تطبيق مستقل غير رسمي. لا يتبع وزارة التعليم العالي ولا الديوان الوطني للخدمات الجامعية ولا يمثّلهما."
    },
    fr: {
      name: "Réservation des repas", tagline: "Réserve vos repas universitaires automatiquement chaque nuit",
      meta: "v{v} · {mb} MB · {d}", dl: "Télécharger l’application",
      sub64: "Version 64 bits — la plupart des téléphones", sub32: "Version 32 bits — téléphones plus anciens",
      alt64: "Téléphone ancien ou installation impossible ? Téléchargez la <a href=\"{u}\">version 32 bits</a>",
      alt32: "Téléphone récent ? Téléchargez la <a href=\"{u}\">version 64 bits</a> (plus rapide)",
      stepsT: "Comment l’installer ?",
      s1: "Téléchargez le fichier. Si le navigateur avertit, choisissez « Conserver » ou « Télécharger quand même ».",
      s2: "Ouvrez le fichier, autorisez l’installation depuis cette source quand le téléphone le demande, puis appuyez sur « Installer ».",
      s3: "Ouvrez « Réservation des repas », lisez les conditions, acceptez, puis ajoutez votre compte.",
      newT: "Nouveautés",
      tgTip: "Depuis Telegram ? Si le téléchargement ne démarre pas, ouvrez le lien dans Chrome.",
      updTip: "Après l’installation, l’application se met à jour toute seule à chaque nouvelle version.",
      notAndroid: "Cette application est pour Android uniquement. Ouvrez cette page depuis votre téléphone.",
      foot: "Application indépendante, non officielle. Elle n’est ni affiliée ni représentative du ministère de l’Enseignement supérieur ou de l’Office national des œuvres universitaires."
    },
    en: {
      name: "Meal Booking", tagline: "Books your university meals automatically every night",
      meta: "v{v} · {mb} MB · {d}", dl: "Download the app",
      sub64: "64-bit version — most phones", sub32: "32-bit version — older phones",
      alt64: "Old phone or it won’t install? Get the <a href=\"{u}\">32-bit version</a>",
      alt32: "Newer phone? Get the <a href=\"{u}\">64-bit version</a> (faster)",
      stepsT: "How to install",
      s1: "Download the file. If the browser warns you, choose “Keep” or “Download anyway”.",
      s2: "Open the downloaded file, allow installs from this source when your phone asks, then tap “Install”.",
      s3: "Open “Meal Booking”, read the terms, accept, then add your account.",
      newT: "What’s new",
      tgTip: "From Telegram? If the download doesn’t start, open the link in Chrome.",
      updTip: "After installing, the app updates itself whenever a new version is released.",
      notAndroid: "This app is for Android phones only. Open this page from your phone.",
      foot: "Independent, unofficial app. It is not affiliated with or representing the Ministry of Higher Education or the National Office of University Services."
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  var mb = function (b) { return (b / 1048576).toFixed(1); };
  var a64 = R.apks["arm64-v8a"], a32 = R.apks["armeabi-v7a"];
  var bits = 0;      // 64 | 32 | 0 (مجهول)
  var lang = "ar";   // العربية الافتراضية دائماً؛ ما يختاره الزائر يُحفظ

  try { var saved = localStorage.getItem("lang"); if (saved && T[saved]) lang = saved; } catch (e) {}
  var q = /[?&]lang=(ar|fr|en)\b/.exec(location.search); if (q) lang = q[1];

  function fmtDate(iso) {
    try {
      var loc = lang === "ar" ? "ar-DZ-u-nu-latn" : lang === "fr" ? "fr-FR" : "en-GB";
      return new Date(iso + "T12:00:00").toLocaleDateString(loc, { day: "numeric", month: "long", year: "numeric" });
    } catch (e) { return iso; }
  }

  function render() {
    var t = T[lang], main = (bits === 32 ? a32 : a64), alt = (bits === 32 ? a64 : a32);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t.name + " — " + t.dl;
    $("name").textContent = t.name;
    $("tagline").textContent = t.tagline;
    $("meta").textContent = t.meta.replace("{v}", R.versionName).replace("{mb}", mb(main.size)).replace("{d}", fmtDate(R.released));
    $("dlText").textContent = t.dl;
    $("dlSub").textContent = bits === 32 ? t.sub32 : t.sub64;
    $("dl").href = main.url;
    $("alt").innerHTML = (bits === 32 ? t.alt32 : t.alt64).replace("{u}", alt.url);
    ["stepsT", "s1", "s2", "s3", "newT", "tgTip", "updTip", "foot"].forEach(function (k) { $(k).textContent = t[k]; });
    var notes = (R.notes && (R.notes[lang] || R.notes.ar)) || "";
    $("notes").textContent = notes;
    $("newCard").classList.toggle("hide", !notes);
    var android = /Android/i.test(navigator.userAgent);
    $("notice").style.display = android ? "none" : "block";
    $("notice").textContent = t.notAndroid;
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-l") === lang ? "true" : "false");
    });
  }

  // «aarch64/arm64/x86_64» ⇒ 64، «armv7l/armv8l» (نظام 32 بت) ⇒ 32، غير ذلك ⇒ 0 (مجهول). مكشوفة للاختبار.
  function bitsFromString(p) {
    if (/aarch64|arm64|x86_64|x64|win64/i.test(p)) return 64;
    if (/armv7|armv8l|armv6/i.test(p)) return 32;
    return 0;
  }
  window.__bitsFromString = bitsFromString;

  // 64 أم 32 بت؟ userAgentData (كروم) أدقّ، ثم navigator.platform: «aarch64» ⇒ 64، «armv7l/armv8l» ⇒ 32.
  function detect() {
    var done = function (b) { bits = b; render(); };
    var fallback = function () {
      return bitsFromString((navigator.platform || "") + " " + (navigator.userAgent || ""));
    };
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        navigator.userAgentData.getHighEntropyValues(["bitness"]).then(function (h) {
          done(h.bitness === "64" ? 64 : h.bitness === "32" ? 32 : fallback());
        }, function () { done(fallback()); });
        return;
      }
    } catch (e) {}
    done(fallback());
  }

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-l");
      try { localStorage.setItem("lang", lang); } catch (e) {}
      render();
    });
  });
  render();   // فوري بالافتراضي 64 بت ثم يُصحَّح بعد الكشف
  detect();
})();
</script>
</body>
</html>
